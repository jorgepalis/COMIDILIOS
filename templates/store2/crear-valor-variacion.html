{% extends "main/base.html" %}
{% load static %}
{% load static tailwind_tags %}

{% block title %}
<title>Crear valor variación</title>
{% endblock title %}

{% block main %}

<div class="flex overflow-x-auto mt-10 items-center justify-center mx-5 flex-col">
    <form action="{% url 'store2:crear-valor-variacion' variation.pk %}" method="post" class="rounded-lg shadow-md w-2/3 p-3 mb-10">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit" class="bg-blue-500 mt-5 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Crear valor</button>
    </form> 
    
</div>

{% endblock main %}
